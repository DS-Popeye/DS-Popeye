name: Update WakaTime Development Stats

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-readme
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README with WakaTime metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Update WakaTime section
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: waka
          LOCALE: en
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SHOW_UPDATED_DATE: "True"
          COMMIT_MESSAGE: "chore: update WakaTime development stats"
